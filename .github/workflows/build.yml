name: build

on:
  push:
    branches: [main]
    paths: ['engine/**', 'app/**', 'meson.build', 'Info.plist', 'scripts/**', '.github/workflows/build.yml']
  pull_request:
    branches: [main]
    paths: ['engine/**', 'app/**', 'meson.build', 'Info.plist', 'scripts/**', '.github/workflows/build.yml']

# Cancel an older run on the same ref when a new push lands.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v6

      - name: Install Meson + Ninja
        run: brew install meson ninja

      - name: Configure (release + LTO)
        run: meson setup build --buildtype=release -Db_lto=true

      - name: Compile
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs
