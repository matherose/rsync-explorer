name: RsyncExplorer
options:
  bundleIdPrefix: com.joeltordjman
  deploymentTarget:
    iOS: "17.0"   # Citadel (SFTP) requires iOS 17.0 minimum
# MobileVLCKit (video) is added at Phase D. Signing for a physical device is set
# in Xcode GUI; record DEVELOPMENT_TEAM here once chosen so regeneration keeps it.
# Simulator builds need no team.
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1
  VLCKit:
    # Community SPM repackaging of VideoLAN's stable MobileVLCKit 3.6.0 binary.
    url: https://github.com/tylerjonesio/vlckit-spm.git
    from: 3.6.0
  SwiftNIO:
    # Already pulled transitively by Citadel; declared directly so we can link
    # NIOHTTP1 for the local streaming bridge.
    url: https://github.com/apple/swift-nio.git
    from: 2.50.0
targets:
  RsyncExplorer:
    type: application
    platform: iOS
    sources: [RsyncExplorer]
    dependencies:
      - package: Citadel
      - package: VLCKit
        product: VLCKitSPM
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIO
        product: NIOHTTP1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeltordjman.RsyncExplorer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: rsync explorer
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "rsync explorer connects to your NAS on your local network over SFTP."
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
  RsyncExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RsyncExplorerTests]
    dependencies:
      - target: RsyncExplorer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joeltordjman.RsyncExplorerTests
