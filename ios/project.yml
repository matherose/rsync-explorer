name: RsyncExplorer
options:
  bundleIdPrefix: com.joeltordjman
  deploymentTarget:
    iOS: "17.0"   # Citadel (SFTP) requires iOS 17.0 minimum
# MobileVLCKit (video) is added at Phase D. Signing for a physical device is set
# in Xcode GUI; record DEVELOPMENT_TEAM here once chosen so regeneration keeps it.
# Simulator builds need no team.
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1
  VLCKit:
    # Community SPM repackaging of VideoLAN's stable MobileVLCKit 3.6.0 binary.
    url: https://github.com/tylerjonesio/vlckit-spm.git
    from: 3.6.0
  SwiftNIO:
    # Already pulled transitively by Citadel; declared directly so we can link
    # NIOHTTP1 for the local streaming bridge.
    url: https://github.com/apple/swift-nio.git
    from: 2.50.0
  NIOSSH:
    # Same fork URL + range Citadel 0.12.1 already resolves, so SPM reuses the
    # identical package (no duplicate-identity conflict). Needed to implement
    # trust-on-first-use host-key pinning via SSHHostKeyValidator.custom(...).
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
targets:
  RsyncExplorer:
    type: application
    platform: iOS
    sources: [RsyncExplorer]
    dependencies:
      - package: Citadel
      - package: VLCKit
        product: VLCKitSPM
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIO
        product: NIOHTTP1
      - package: NIOSSH
        product: NIOSSH
    info:
      path: RsyncExplorer/Info.plist
      properties:
        CFBundleDisplayName: RsyncFS
        NSLocalNetworkUsageDescription: RsyncFS connects to your NAS on your local network over SFTP.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeltordjman.RsyncExplorer
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
  RsyncExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RsyncExplorerTests]
    dependencies:
      - target: RsyncExplorer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joeltordjman.RsyncExplorerTests
